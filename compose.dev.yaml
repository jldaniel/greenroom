# Development compose: source checkout, Vite dev server, and split
# api/frontend/mcp services. The default production path is compose.yaml (one
# service from the runtime image); run this file with
# `docker compose -f compose.dev.yaml ...` or the `compose:dev:*` scripts.
name: greenroom-dev

x-greenroom-image: &greenroom-image
  build:
    context: .
    dockerfile: Dockerfile
    # The build stage carries the full source tree and dev dependencies
    # (including Vite); the production runtime stage does not.
    target: build
  image: greenroom:dev
  restart: unless-stopped

services:
  api:
    <<: *greenroom-image
    command: ["bun", "--cwd", "apps/server", "src/cli.ts"]
    environment:
      GREENROOM_ALLOWED_ORIGINS: "http://localhost:${GREENROOM_WEB_HOST_PORT:-5173},http://127.0.0.1:${GREENROOM_WEB_HOST_PORT:-5173}"
      GREENROOM_DATA_DIR: /data
      GREENROOM_DB_PATH: /data/${GREENROOM_DB_FILENAME:-greenroom.sqlite}
      GREENROOM_HOST: 0.0.0.0
      # The container binds 0.0.0.0 so Docker can publish the port, but the
      # default publish spec is loopback-only (GREENROOM_PUBLISH_HOST). Set
      # this to "disabled" and pre-provision GREENROOM_BOOTSTRAP_ADMIN_TOKEN
      # when publishing beyond loopback.
      GREENROOM_SETUP_TOKEN_ENDPOINT: ${GREENROOM_SETUP_TOKEN_ENDPOINT:-enabled}
      GREENROOM_BOOTSTRAP_ADMIN_TOKEN: ${GREENROOM_BOOTSTRAP_ADMIN_TOKEN:-}
      GREENROOM_HARNESS_BASE_URL: ${GREENROOM_HARNESS_BASE_URL:-}
      GREENROOM_HARNESS_TOKEN: ${GREENROOM_HARNESS_TOKEN:-}
      GREENROOM_HARNESS_TIMEOUT_MS: ${GREENROOM_HARNESS_TIMEOUT_MS:-180000}
      # Optional fresh-DB seed override (mock or harness:<kind>). Unset:
      # profiles are seeded from harness detection; without a reachable
      # bridge the container seeds mock profiles with an explanation.
      GREENROOM_DEFAULT_AI_BACKEND: ${GREENROOM_DEFAULT_AI_BACKEND:-}
      GREENROOM_LOG_LEVEL: ${GREENROOM_LOG_LEVEL:-info}
      GREENROOM_PORT: "49331"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # Read operations must not refresh repository metadata: the worktree
      # mount is read-only, and optional locks would try to write it.
      GIT_OPTIONAL_LOCKS: "0"
    ports:
      - "${GREENROOM_PUBLISH_HOST:-127.0.0.1}:${GREENROOM_API_HOST_PORT:-49331}:49331"
    volumes:
      - ${GREENROOM_DATA_VOLUME:-greenroom-data}:/data
      # Read-only: reviewed repositories are inputs Greenroom never mutates.
      - ${GREENROOM_WORKTREE_VOLUME:-.}:/worktrees:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:49331/health'); process.exit(response.ok ? 0 : 1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      default:
        aliases:
          - backend

  frontend:
    <<: *greenroom-image
    command: ["bun", "run", "--cwd", "apps/web", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      GREENROOM_API_PROXY_TARGET: http://api:49331
      VITE_GREENROOM_API_BASE_URL: ${VITE_GREENROOM_API_BASE_URL:-}
      VITE_GREENROOM_API_TOKEN: ${VITE_GREENROOM_API_TOKEN:-}
    ports:
      - "${GREENROOM_PUBLISH_HOST:-127.0.0.1}:${GREENROOM_WEB_HOST_PORT:-5173}:5173"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:5173/'); process.exit(response.ok ? 0 : 1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mcp:
    <<: *greenroom-image
    command: ["bun", "--cwd", "packages/mcp", "src/http.ts"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      GREENROOM_API_BASE_URL: http://api:49331
      GREENROOM_API_TOKEN: ${GREENROOM_API_TOKEN:-}
      GREENROOM_MCP_HOST: 0.0.0.0
      GREENROOM_MCP_PORT: "49332"
    ports:
      - "${GREENROOM_PUBLISH_HOST:-127.0.0.1}:${GREENROOM_MCP_HOST_PORT:-49332}:49332"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:49332/health'); process.exit(response.ok ? 0 : 1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  greenroom-data:
